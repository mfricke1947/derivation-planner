<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type">
    <link type="text/css" rel="stylesheet" href="../Proofs.css">
    <title>Hausman Under Construction 1</title>
    <script type="text/javascript" language="javascript" src="../proofs/proofs.nocache.js"></script>
  </head>
  <body>
    <iframe src="javascript:''" id="__gwt_historyFrame" tabindex="-1" style="position:absolute;width:0;height:0;border:0"></iframe>
    <noscript>
      <div style="width: 22em; position: absolute; left: 50%; margin-left: -11em; color: red; background-color: white; border: 1px solid red; padding: 4px; font-family: sans-serif">
        Your web browser must have JavaScript enabled
        in order for this application to display correctly.
      </div>
    </noscript>
    <script type="text/javascript" language="javascript">
   var Parameters = {

  fParser: "hausman",
  fPropLevel: "true",
  fAdvancedMenu: "false",

  fInputText: "<p>Test each rule from the Rules menu (select the lines first, then choose the rule).</p>"+
"<p>P⊃Q, P ∴ Q &nbsp; /*MP*/</p>"+
"<p>P⊃Q, ~Q ∴ ~P &nbsp; /*MT*/</p>"+
"<p>P∨Q, ~P ∴ Q &nbsp; /*DS (either way round for Hausman)*/</p>"+
"<p>P⊃Q, Q⊃R ∴ P⊃R &nbsp; /*HS*/</p>"+
"<p>P.Q ∴ P &nbsp; /*Simp (offers left or right for Hausman)*/</p>"+
"<p>P∨Q, P⊃R, Q⊃S ∴ R∨S &nbsp; /*CD, three lines, any order*/</p>"+
"<p>P⊃Q, P⊃~Q ∴ ~P &nbsp; /*IP*/</p>"+
"<p>(x)(Fx) ∴ Fa &nbsp; /*UI*/</p>"+
"<p>Fa ∴ (∃x)(Fx) &nbsp; /*EG*/</p>",

};
  </script>
    <div id="container">
      <h3>&nbsp;Proofs</h3>
      <hr>
      <div id="menu"> </div>
      <div id="input"> </div>
      <div id="proof"> </div>
      <div id="startButton"></div>
      <hr>
      <div id="journal"></div>
      <div id="buttons"></div>
    </div>
  </body>
</html>
