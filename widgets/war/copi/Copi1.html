"(P⊃Q).(R⊃S), P∨R∴ Q ∨ S  /*CD correct*/"+

"(P⊃Q) ∴ (P⊃(P.Q)) /*Abs correct/ "+
          
          "<p>P                /*Add HA tests*/</p>"+
          "<p>P,Q,P.Q /*Conj Simp correct*/</p>"+
          "<p>P⊃ Q, Q ⊃R,P⊃ Q,P≡ Q, Q ≡R,P≡ Q /*Tran test*/</p>" +
          "<p>P∨ Q, ~P ∨R,P∨ Q,P⊕ Q, ~P ⊕R,P⊕ Q /*Res test*/</p>" +
          "<p>P∨R,(P⊃Q).(R⊃S),P∨R,~Q∨~S,(P⊃Q).(R⊃S),~Q∨~S /*TD test*/</p>"+
          "<p>P⊃Q /*TA test*/</p>"+


"<p>(a) (x)(Fx) ∴ Fa</p>" +

"<p>(b) (x)(Fx) ∴ Fa.Fb</p>" +

"<p>(c) Fc,(x)(Fx⊃Gx) ∴ Gc</p>" +

"<p>(d) Fa,(x)(Fx⊃Gx), (x)(Gx⊃Hx) ∴Ha</p>" +

"<p>(e) (x)(Fx⊃Gx), (x)(Gx⊃Hx) ∴(Fa⊃Ha)</p>"




          ,
 
};
