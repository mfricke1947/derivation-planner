 <!-- Draw a diagram above, then click "Get preloadSvg" -- it fills the box below with a
      ready-to-paste  var preloadSvg = '...';  line (quotes already escaped, one line, matching
      every exercise page's own style) and selects it, so the next step is just Cmd+C/Ctrl+C,
      then paste straight into a new exercise HTML file's <script> block.

 mf 8/30/26, updated 2026-09-05 -->

 <textarea id="preloadSvgOutput" readonly rows="6" style="width:95%;font-family:monospace;font-size:12px;display:block;margin-top:8px;"
     placeholder="Click &quot;Get preloadSvg&quot; after drawing, then Cmd+C/Ctrl+C to copy (the text is auto-selected for you)."></textarea>

 <script type="text/javascript">
 function exportPreloadSvg(){
     svgCanvas.getSvgString()(function(data, error){
         var box = document.getElementById('preloadSvgOutput');
         if (error){
             box.value = 'Error getting SVG: ' + error;
             return;
         }
         var escaped = data
             .replace(/\\/g, '\\\\')   // backslashes first, so this doesn't double-escape the quote-escaping below
             .replace(/'/g, "\\'")     // single quotes, since preloadSvg is a single-quoted JS string
             .replace(/\r?\n/g, '');   // keep it one line, matching every existing exercise page
         box.value = "var preloadSvg = '" + escaped + "';";
         box.focus();
         box.select();
     });
 }
 </script>
